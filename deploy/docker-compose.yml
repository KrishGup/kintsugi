# Kintsugi on any Docker host (a NAS, a VPS, your desk): the same image Azure runs, /data on a named volume.
#   cp .env.example .env   # set OPENAI_API_KEY and, for anything reachable from the internet, KIN_AUTH=token + KIN_ACCESS_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  kintsugi:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kintsugi:local
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      KIN_DATA_DIR: /data
      KIN_SESSIONS_DIR: /data/sessions
      KIN_ENV_FILE: /data/.env
      KIN_PROXY_HEADERS: "1"
    volumes:
      - kintsugi-data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kintsugi-data:
